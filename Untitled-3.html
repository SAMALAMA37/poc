<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Upload files/folder to webhook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
    .row { margin: 0.75rem 0; }
    button { padding: 0.6rem 1rem; cursor: pointer; }
    #log { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <h1>Upload to Webhook</h1>

  <div class="row">
    <label>
      <strong>Select files</strong>
      <input id="files" type="file" multiple />
    </label>
  </div>

  <div class="row">
    <label>
      <strong>Or select a folder</strong> (Chrome/Edge/Brave)
      <input id="folder" type="file" webkitdirectory directory multiple />
    </label>
  </div>

  <div class="row">
    <label>
      Webhook URL:
      <input id="url" type="url" style="width: 32rem;"
             value="https://webhook.site/6fa99692-c961-412d-92c1-d11cb3137ca3" />
    </label>
  </div>

  <div class="row">
    <button id="send">Send selection</button>
  </div>

  <div id="log"></div>

<script>
(async () => {
  const $ = id => document.getElementById(id);
  const log = msg => { $('log').textContent += msg + "\n"; };

  function collectFiles() {
    // Merge files from both pickers; de-duplicate by name+size+lastModified
    const set = new Map();
    const addList = (list) => {
      for (const f of list) {
        const key = `${f.name}:${f.size}:${f.lastModified}`;
        if (!set.has(key)) set.set(key, f);
      }
    };
    addList($('files').files);
    addList($('folder').files);
    return Array.from(set.values());
  }

  $('send').addEventListener('click', async () => {
    const files = collectFiles();
    if (!files.length) {
      log('Please choose at least one file or a folder.');
      return;
    }

    const webhook = $('url').value.trim();
    if (!/^https?:\/\//i.test(webhook)) {
      log('Invalid webhook URL.');
      return;
    }

    // Build multipart form payload
    const form = new FormData();
    // Include relative path when available (webkitRelativePath preserves folder structure)
    for (const f of files) {
      const rel = f.webkitRelativePath || f.name;
      form.append('files[]', f, rel);
    }

    // Header summary (keep small!)
    const names = files.slice(0, 50).map(f => f.webkitRelativePath || f.name);
    const headerSummary = names.join(',');

    log(`Uploading ${files.length} file(s) to ${webhook} ...`);

    try {
      const res = await fetch(webhook, {
        method: 'POST',
        // Note: Let the browser set the multipart boundary Content-Type for FormData
        body: form,
        headers: {
          // Keep headers tiny; many servers limit header size (~8–16 KB total)
          'X-Files-Summary': headerSummary
        },
        // If the webhook does not send CORS headers, you can use no-cors,
        // but you won’t be able to read the response in the page:
        // mode: 'no-cors'
      });

      // If CORS is allowed, show status; otherwise this may throw due to opaque response
      log(`Done. HTTP status: ${res.status} ${res.statusText}`);
      const text = await res.text().catch(() => '');
      if (text) log(`Response body:\n${text}`);
    } catch (e) {
      log('Upload finished (or blocked by CORS). Check your webhook dashboard to verify receipt.');
      log(String(e));
    }
  });
})();
</script>
</body>
</html>
